name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtpdf'

      - name: Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Frontend C++ (Qt6 Release)
        shell: cmd
        run: |
          cmake -B build_windows -S qt_frontend -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          cmake --build build_windows --config Release --parallel

      - name: Setup Tools (Inno Setup & Tesseract)
        shell: pwsh
        run: |
          choco install innosetup tesseract --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Copy Frontend, Bundle Resources and Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_windows
          New-Item -ItemType Directory -Force -Path dist_installer

          if (Test-Path "build_windows\Release\Vellum.exe") {
              Copy-Item -Recurse -Force "build_windows\Release\*" "release_windows\"
          } elseif (Test-Path "build_windows\Vellum.exe") {
              Copy-Item -Recurse -Force "build_windows\*" "release_windows\"
          }

          Copy-Item -Force "qt_frontend\resources\app_icon.ico" "release_windows\app_icon.ico"
          Copy-Item -Force "download_models.bat" "release_windows\download_models.bat"

          # 1. Empacotar Tesseract-OCR portátil em release_windows
          if (Test-Path "C:\Program Files\Tesseract-OCR") {
              Write-Host "Copiando Tesseract-OCR oficial..."
              Copy-Item -Recurse -Force "C:\Program Files\Tesseract-OCR" "release_windows\Tesseract-OCR"
              # Idioma Portugues para OCR duplo (Ingles + Portugues)
              New-Item -ItemType Directory -Force -Path "release_windows\Tesseract-OCR\tessdata"
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata" -OutFile "release_windows\Tesseract-OCR\tessdata\por.traineddata"
          }

          # 2. Empacotar Modelos Whisper (tiny e base) para funcionamento offline imediato
          Write-Host "Baixando modelos Whisper para o pacote..."
          New-Item -ItemType Directory -Force -Path "release_windows\models\whisper"
          Invoke-WebRequest -Uri "https://openaipublic.azureedge.net/main/whisper/models/d3dd57d32accea0b295c96e26691aa14d8822fac7d9d27d5dc00ba0adc22e8dd/tiny.en.pt" -OutFile "release_windows\models\whisper\tiny.en.pt"
          Invoke-WebRequest -Uri "https://openaipublic.azureedge.net/main/whisper/models/256150255c601dbb170ef89248a8458ad4cf37081fa97e5b2eb5de50d1da676e/base.en.pt" -OutFile "release_windows\models\whisper\base.en.pt"

          # 3. Coletar DLLs do Qt com windeployqt
          $windeployqt = (Get-Command windeployqt.exe -ErrorAction SilentlyContinue).Source
          if (-not $windeployqt -and $env:Qt6_DIR) {
              $candidate = Join-Path (Split-Path (Split-Path (Split-Path $env:Qt6_DIR))) "bin\windeployqt.exe"
              if (Test-Path $candidate) { $windeployqt = $candidate }
          }
          if ($windeployqt) {
              & $windeployqt --no-translations --compiler-runtime "release_windows\Vellum.exe"
          }

      - name: Package Python Backend with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconsole --name vellum_backend --onedir --collect-all whisper --collect-all uvicorn --distpath "temp_dist" main.py
          Move-Item -Force "temp_dist\vellum_backend" "release_windows\backend"
          Remove-Item -Recurse -Force "temp_dist"

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
              if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
                  $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
                  $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
              } elseif (Test-Path "C:\ProgramData\chocolatey\bin\iscc.exe") {
                  $iscc = "C:\ProgramData\chocolatey\bin\iscc.exe"
              }
          }
          if (-not $iscc) {
              throw "Inno Setup compiler (ISCC.exe) not found!"
          }
          Write-Host "Compilando com Inno Setup em: $iscc"
          & $iscc installer_windows.iss 2>&1 | Tee-Object -Variable isccOutput
          if ($LASTEXITCODE -ne 0) {
              $isccOutput | ForEach-Object { Write-Host $_ }
              throw "ISCC compilation failed with code $LASTEXITCODE"
          }
          Get-ChildItem -Path dist_installer

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "temp_portable\Vellum"
          Copy-Item -Recurse -Force "release_windows\*" "temp_portable\Vellum\"
          Compress-Archive -Path "temp_portable\Vellum" -DestinationPath "dist_installer\Vellum-v1.0.1-Windows-x86_64.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force "temp_portable"
          Get-ChildItem -Path dist_installer

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vellum-Windows-Builds
          path: |
            dist_installer/Vellum-Setup-Windows-v*.exe
            dist_installer/Vellum-*-Windows-x86_64.zip

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/Vellum-Setup-Windows-v*.exe
            dist_installer/Vellum-*-Windows-x86_64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
