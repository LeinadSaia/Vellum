name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtpdf'

      - name: Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Frontend C++ (Qt6 Release)
        shell: cmd
        run: |
          cmake -B build_windows -S qt_frontend -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          cmake --build build_windows --config Release --parallel

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package Release Directory and Generate Installer
        shell: cmd
        run: |
          mkdir release_windows
          mkdir dist_installer

          if exist "build_windows\Release\Vellum.exe" (
              copy /y "build_windows\Release\Vellum.exe" "release_windows\Vellum.exe"
          ) else (
              copy /y "build_windows\Vellum.exe" "release_windows\Vellum.exe"
          )
          copy /y "qt_frontend\resources\app_icon.ico" "release_windows\app_icon.ico"
          copy /y "download_models.bat" "release_windows\download_models.bat"

          windeployqt --no-translations --compiler-runtime "release_windows\Vellum.exe"

          pyinstaller --clean --noconsole --name vellum_backend --onedir --distpath "temp_dist" main.py
          move "temp_dist\vellum_backend" "release_windows\backend"
          rmdir /s /q "temp_dist"

          where iscc >nul 2>nul
          if %errorlevel% equ 0 (
              iscc installer_windows.iss
          ) else (
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss
          )

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vellum-Setup-Windows
          path: dist_installer/Vellum-Setup-Windows-v*.exe

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/Vellum-Setup-Windows-v*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
